<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لیگ بلک‌فرایدی • سرژه</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@font-face{font-family:"Vazirmatn";src:url("fonts/Vazirmatn-Regular.ttf");font-weight:400}
@font-face{font-family:"Vazirmatn";src:url("fonts/Vazirmatn-Bold.ttf");font-weight:700}
:root{--r:16px;--gold:#F5B301}
[data-theme="dark"]{--bg:#0B0D12;--card:#141924;--card2:#1A2230;--ink:#F2F4F8;--muted:#9AA3B5;--line:rgba(255,255,255,.10);--shadow:0 14px 30px rgba(0,0,0,.45);--chip:#1D2534;--drawer:rgba(255,255,255,.03)}
[data-theme="light"]{--bg:#F3F1EA;--card:#FFFFFF;--card2:#FFFDF6;--ink:#14161B;--muted:#5D6574;--line:#E4DDCB;--shadow:0 12px 26px rgba(60,50,20,.12);--chip:#F3EEE1;--drawer:rgba(0,0,0,.03)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Vazirmatn",system-ui;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 240px at 85% -40px,rgba(245,179,1,.13),transparent 70%),radial-gradient(700px 280px at 10% 0%,rgba(80,120,255,.09),transparent 70%)}
.wrap{max-width:1020px;margin:0 auto;padding:0 12px 40px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logoBox{position:relative;width:118px;height:44px;border-radius:13px;background:#0B0D12;border:1px solid rgba(245,179,1,.45);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.logoBox img{width:96px;height:auto;display:block}
.logoBox::after{content:"";position:absolute;top:-60%;bottom:-60%;width:26%;left:-40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35) 50%,transparent);transform:skewX(-18deg);animation:shine 9s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}95%,100%{left:130%}}
.brand h1{margin:0;font-size:19px;line-height:1.3}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap}
.live i{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-family:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.sbtn:focus-visible,.rowhead:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sec{margin-top:10px}
.sec h2{font-size:14.5px;margin:12px 2px 8px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.pods-sec{margin-top:12px}
.pods{display:grid;grid-template-columns:1fr;gap:8px}
.pod{border-radius:15px;padding:10px 10px 9px;text-align:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:var(--shadow);min-height:100%}
.pod::after{content:"";position:absolute;top:-70%;bottom:-70%;width:24%;left:-45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.38) 50%,transparent);transform:skewX(-18deg);animation:shine 11s ease-in-out infinite;pointer-events:none;opacity:.55}
.pod.gold{order:1;background:linear-gradient(155deg,#5e4300,#c99600 30%,#ffe9a8 50%,#c99600 70%,#5e4300);color:#241a00}
.pod.silver{order:2;background:linear-gradient(155deg,#4b5563,#9fb0c3 30%,#ffffff 50%,#9fb0c3 70%,#4b5563);color:#1a2230}
.pod.bronze{order:3;background:linear-gradient(155deg,#4e2c0d,#b26a24 30%,#f7c88f 50%,#b26a24 70%,#4e2c0d);color:#26130a}
@media(min-width:760px){.pods{grid-template-columns:1fr 1.08fr 1fr;align-items:end}.pod.silver{order:1}.pod.gold{order:2;transform:translateY(-8px)}.pod.bronze{order:3}}
.pod .md{font-size:19px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));line-height:1}
.pod .nm{font-weight:700;font-size:13.5px;margin-top:3px;text-align:center;line-height:1.5}
.pod .rk{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.30);color:#fff;border-radius:999px;padding:1px 11px}
.ptable{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.8);border-radius:11px;overflow:hidden;margin-top:8px;box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(0,0,0,.12)}
.prow{display:flex;justify-content:space-between;align-items:center;padding:3px 10px;font-size:12px;border-bottom:1px solid rgba(0,0,0,.07);line-height:1.9}
.prow:last-child{border-bottom:0}
.prow:nth-child(odd){background:rgba(0,0,0,.025)}
.prow .k{color:#454545;font-size:11px}
.prow .v{font-weight:700;color:#111;font-size:13px;font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
@media(min-width:560px){.totals{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.totals{grid-template-columns:repeat(6,1fr)}}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,transparent,hsl(var(--h,45) 85% 55%),transparent)}
.kpi small{display:block;font-size:11px;color:var(--muted);text-align:center}
.kpi b{font-size:16.5px;text-align:center}
.kpi span{display:block;font-size:10.5px;color:var(--muted)}
.toolbar{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-family:inherit;font-size:13px;color:var(--ink)}
.sortbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;width:100%}
.sbtn{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer}
.sbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.head{display:none}
@media(min-width:900px){.head{display:grid;grid-template-columns:50px 1.2fr repeat(6,minmax(80px,1fr)) 26px;gap:8px;align-items:center;font-size:11px;color:var(--muted);padding:4px 12px;text-align:center}.head button{background:none;border:0;color:inherit;font-family:inherit;font-size:11px;cursor:pointer;white-space:nowrap}.head button.on{color:var(--ink);font-weight:700}}
#league{display:flex;flex-direction:column;gap:9px}
.row{background:linear-gradient(135deg,hsl(var(--h) 55% 45% / .16),transparent 55%),linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative}
.row::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,hsl(var(--h) 70% 40%),hsl(calc(var(--h) + 40) 70% 45%),transparent)}
.rowhead{display:grid;grid-template-columns:42px 1fr 26px;grid-template-areas:"rank store chev" "metrics metrics metrics";gap:8px;align-items:center;width:100%;background:none;border:0;color:var(--ink);font-family:inherit;text-align:center;padding:10px 10px 9px;cursor:pointer}
@media(min-width:900px){.rowhead{grid-template-columns:50px 1.2fr repeat(6,minmax(0,1fr)) 26px;grid-template-areas:"rank store m1 m2 m3 m4 m5 m6 chev";padding:11px 12px 10px}}
.rank{grid-area:rank;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 55% 30%),hsl(var(--h) 60% 18%));border:1px solid hsl(var(--h) 60% 38% / .8);box-shadow:0 3px 0 rgba(0,0,0,.45),0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);text-align:center}
.rank.r1{background:linear-gradient(145deg,#8a6400,#3d2c00);border-color:#ffd84d;color:#ffe9a3;box-shadow:0 3px 0 #1d1500,0 8px 18px rgba(245,179,1,.35),inset 0 1px 0 #ffe9a3}
.rank.r2{background:linear-gradient(145deg,#6b7686,#2b323d);border-color:#dfe6ef;color:#f2f6fb;box-shadow:0 3px 0 #141920,0 8px 18px rgba(160,175,195,.35),inset 0 1px 0 #fff}
.rank.r3{background:linear-gradient(145deg,#8a4e16,#3a2008);border-color:#f0a35e;color:#ffe2c2;box-shadow:0 3px 0 #1d0f04,0 8px 18px rgba(205,127,50,.35),inset 0 1px 0 #ffd9ab}
.storebox{grid-area:store;min-width:0;text-align:center}
.store{font-weight:700;font-size:14.5px;text-align:center;line-height:1.5}
.sub{font-size:11px;color:var(--muted);text-align:center}
.mgrid{grid-area:metrics;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
@media(min-width:900px){.mgrid{display:contents}}
.m{background:rgba(127,140,160,.10);border:1px solid var(--line);border-radius:10px;padding:4px 4px;min-width:0;text-align:center}
@media(min-width:900px){.m{grid-area:auto}}
.m small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;text-align:center}
.m b{font-size:13.5px;white-space:nowrap;text-align:center}
.m.hot{background:hsl(var(--h) 70% 50% / .16);border-color:hsl(var(--h) 70% 50% / .4)}
.chev{grid-area:chev;font-size:16px;color:var(--muted);justify-self:center}
.row.open .chev{transform:rotate(180deg)}
.drawer{display:none;border-top:1px dashed var(--line);padding:9px 10px 12px;background:var(--drawer)}
.row.open .drawer{display:block}
.drawer h3{margin:0 0 8px;font-size:12.5px;display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap}
.gwrap{overflow-x:auto;border-radius:10px}
.gtable{min-width:640px;display:flex;flex-direction:column;gap:5px}
.grow{display:grid;grid-template-columns:1.3fr repeat(6,1fr);gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12.5px;text-align:center}
.grow.ghead{background:none;border:0;color:var(--muted);font-size:10.5px;padding:0 9px}
.grow b{font-size:12.5px;text-align:center}
.foot{margin:22px 0 6px;text-align:center;font-size:10.5px;letter-spacing:.4px;color:var(--muted)}
.foot b{background:linear-gradient(90deg,#8a6400,#c99600,#8a6400);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:1px}
@media(prefers-reduced-motion:reduce){.live i,.logoBox::after,.pod::after{animation:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head>
<body><div class="wrap">
<div class="top">
<div class="brand"><span class="logoBox"><img src="logo.svg" alt="SERGE"></span><div><h1>لیگ بلک‌فرایدی</h1><p>سرژه • جدول زنده فروشگاه‌ها</p></div></div>
<div class="actions"><span class="live"><i></i>زنده <b id="clock">--:--</b></span><button class="btn" id="unitBtn">میلیون ریال</button><button class="btn" id="themeBtn">🌙 تاریک</button></div>
</div>
<div class="sec pods-sec"><div class="pods" id="pods"></div></div>
<div class="sec"><h2>📊 خلاصه فروش فروشگاه‌ها</h2><div class="totals" id="totals"></div></div>
<div class="sec"><h2>📊 جدول لیگ — فروشگاه‌ها <span class="tag" id="countLine"></span></h2>
<div class="toolbar"><input class="search" id="q" placeholder="جست‌وجو: نام فروشگاه یا کارگروه…"><div class="sortbar" id="sortbar"></div></div>
<div class="head" id="headRow"></div>
<div id="league"></div>
</div>
<div class="foot">Designed &amp; Developed by <b>Amir Mohammadi</b></div>
</div>
<script src="app.js"></script>
</body></html>
